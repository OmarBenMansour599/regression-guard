name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = supported minimum; 3.14 = local development version (ADR 0004)
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python scripts/check.py

  # Dashboard (Phase 8, ADR 0007): type check, lint, tests, build, and the TypeScript API
  # types must match the backend's OpenAPI description (regenerate: see docs/dashboard.md).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci --ignore-scripts
      - name: API types match the backend
        run: |
          (cd ../backend && uv sync --locked && uv run python -m regguard openapi \
            --out ../frontend/openapi.json -c ../examples/support-email-classifier/regguard.yaml)
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.ts \
            || { echo "::error::API types are out of date: run the commands in docs/dashboard.md"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  # The history database must work on PostgreSQL too (ADR 0005). Locally we only run SQLite:
  # PostgreSQL drivers are compiled libraries that Windows Smart App Control may block.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regguard
          POSTGRES_PASSWORD: regguard-ci-only # throwaway service container, not a secret
          POSTGRES_DB: regguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      REGGUARD_TEST_DATABASE_URL: postgresql+psycopg://regguard:regguard-ci-only@localhost:5432/regguard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra postgres
      - name: Migrations and repository on PostgreSQL
        run: uv run python -m pytest tests/unit/test_db.py -v
