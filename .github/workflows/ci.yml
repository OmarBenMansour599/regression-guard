name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = supported minimum; 3.14 = local development version (ADR 0004)
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python scripts/check.py

  # Dashboard (Phase 8, ADR 0007): type check, lint, tests, build, and the TypeScript API
  # types must match the backend's OpenAPI description (regenerate: see docs/dashboard.md).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci --ignore-scripts
      - name: API types match the backend
        run: |
          (cd ../backend && uv sync --locked && uv run python -m regguard openapi \
            --out ../frontend/openapi.json -c ../examples/support-email-classifier/regguard.yaml)
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.ts \
            || { echo "::error::API types are out of date: run the commands in docs/dashboard.md"; exit 1; }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  # Dashboard in a real browser (Phase 8e): every page in light and dark mode renders, logs no
  # console error and passes an axe WCAG 2 A/AA audit. History is seeded with the mock
  # provider: no API key, no cost.
  e2e:
    runs-on: ubuntu-latest
    env:
      REGGUARD_LLM_PROVIDER: mock
      REGGUARD_REQUESTS_PER_MINUTE: "10000"
      REGGUARD_DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
      REGGUARD_RUNS_DIR: ${{ runner.temp }}/runs
      REGGUARD_CACHE_DIR: ${{ runner.temp }}/cache
      REGGUARD_REPORTS_DIR: ${{ runner.temp }}/reports
      CONFIG: ../examples/support-email-classifier/regguard.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci --ignore-scripts && npx playwright install --with-deps chromium)
      - name: Build the dashboard
        working-directory: frontend
        run: npx vite build
      - name: Seed a history (mock answers; FAIL verdicts are expected)
        working-directory: backend
        run: |
          for prompt in v1 v2; do
            uv run python -m regguard run -p "$prompt" --baseline main --cases-from-baseline \
              --no-judge -c "$CONFIG" > /dev/null || true
          done
          uv run python -m regguard history list
      - name: Browser tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --project=chromium
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # The history database must work on PostgreSQL too (ADR 0005). Locally we only run SQLite:
  # PostgreSQL drivers are compiled libraries that Windows Smart App Control may block.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regguard
          POSTGRES_PASSWORD: regguard-ci-only # throwaway service container, not a secret
          POSTGRES_DB: regguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      REGGUARD_TEST_DATABASE_URL: postgresql+psycopg://regguard:regguard-ci-only@localhost:5432/regguard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra postgres
      - name: Migrations and repository on PostgreSQL
        run: uv run python -m pytest tests/unit/test_db.py -v
