[project]
name = "regguard"
dynamic = ["version"]
description = "Automated regression detection for LLM-powered applications"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "typer>=0.12,<1",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
# PostgreSQL driver for the history database (Linux servers/CI). Not needed for local SQLite.
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
regguard = "regguard.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "import-linter>=2.1",
]

[tool.uv]
# mypy's wheels ship unsigned compiled modules that Windows Smart App Control blocks.
# Built from source it is pure Python: slower (~10 s) but runs everywhere. See ADR 0004.
no-binary-package = ["mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/regguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/regguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/regguard/core/types.py" = ["S105"]  # enum member PASS is not a password

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "regguard"

[[tool.importlinter.contracts]]
name = "Layered architecture (higher layers may import lower ones, never the reverse)"
type = "layers"
layers = [
    "regguard.cli",
    "regguard.services",
    "regguard.evaluation | regguard.comparison | regguard.reporting | regguard.notifications",
    "regguard.metrics",
    "regguard.apps",
    "regguard.prompts | regguard.datasets | regguard.storage",
    "regguard.providers",
    "regguard.core",
]
