# Golden test cases for the support-email classifier. Read docs/labeling-guide.md first.
#
# Rules: written and labeled by a human (no LLM), fictional people only, use
# example.com addresses. Never renumber or reuse an id.
#
# Check your work from backend/:
#   uv run python -m regguard dataset validate -c ../examples/support-email-classifier/regguard.yaml
#
# Template (copy it, then delete the leading "# " on each line):
#
# - id: email-0001
#   input:
#     email: |
#       Write the customer's email here.
#       It can span several lines.
#   expected:
#     category: billing        # billing | technical | account | general
#     summary: "Customer ... (one sentence, in English)."
#   difficulty: easy           # easy | medium | hard
#   tags: []                   # e.g. [ambiguous, typo]
#   critical: false
#   notes: "Why this case matters."
#
# Replace the [] below with your list of cases.


- id: email-0001
  input:
    email: |
      From: sophie.martin@example.com
      Subject: Unexpected charge on my account

      Hello,

      I noticed that I was charged $49.99 for my monthly subscription, but I thought my plan cost $29.99.

      Could you please explain why I was charged this amount and check whether I can get a refund for the difference?

      Thank you,
      Sophie
  expected:
    category: billing
    summary: "Customer was charged more than expected for a monthly subscription and requests an explanation and refund."
  difficulty: easy
  tags: [refund]
  critical: true

