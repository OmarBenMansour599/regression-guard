id: classify
version: v2
description: >
  Experimental terse variant: no category definitions, no few-shot examples.
  Expected to regress on ambiguous emails. Useful for demonstrating regression detection. (demo)
created_at: 2026-11-10

model:
  model: google/gemma-4-26b-a4b-it:free
  temperature: 0.0
  max_tokens: 200
  seed: 42
  json_mode: true

system: |
  Classify the support email as billing, technical, account, or general, and summarize it
  in one sentence. Reply with JSON: {"category": "...", "summary": "..."}

user_template: |
  $email

input_variables: [email]
